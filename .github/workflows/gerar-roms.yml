name: Gerar lista de ROMs
on:
  push:
    paths:
      - 'roms/**'
      - '!roms/roms.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/gerar-roms.js
      - name: Salvar roms.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add roms/roms.json
          git diff --cached --quiet || (git commit -m "Atualiza roms.json" && git push)
