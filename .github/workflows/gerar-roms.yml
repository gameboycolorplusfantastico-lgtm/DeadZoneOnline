name: Gerar lista de ROMs
on:
  push:
    paths:
      - 'roms/**'
      - '!roms/roms.json'
      - 'tools/gerar-roms.js'
      - '.github/workflows/gerar-roms.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gerar-roms
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/gerar-roms.js
      - name: Salvar roms.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add roms/roms.json
          if git diff --cached --quiet; then
            echo "roms.json já está atualizado"
          else
            git commit -m "Atualiza roms.json"
            git pull --rebase origin main
            git push
          fi
