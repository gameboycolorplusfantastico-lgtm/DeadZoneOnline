name: Atualizar lista de ROMs

on:
  push:
    paths:
      - 'roms/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar roms/roms.json
        run: |
          python3 - <<'PY'
          import json, os
          path = 'roms/roms.json'
          old = {}
          if os.path.exists(path):
              try:
                  old = {g['file']: g for g in json.load(open(path, encoding='utf-8'))}
              except Exception:
                  pass
          out = []
          for f in sorted(os.listdir('roms')):
              if f.lower().endswith(('.gba', '.zip')):
                  g = old.get(f, {})
                  out.append({'file': f,
                              'title': g.get('title') or os.path.splitext(f)[0].replace('-', ' ').replace('_', ' '),
                              'author': g.get('author', '')})
          json.dump(out, open(path, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add roms/roms.json
          git diff --cached --quiet || git commit -m "Atualiza roms.json" && git push
